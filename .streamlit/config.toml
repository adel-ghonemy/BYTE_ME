[theme]
# White, not "transparent": Streamlit uses this color to fill dropdown menus,
# buttons and pop-ups. The marble picture behind the page comes from app.py.
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f8fa"
# Orange, to match the banners. Main buttons use this color.
primaryColor = "#e85d04"

[theme.sidebar]
backgroundColor = "#f6f8fa"
secondaryBackgroundColor = "#eaeef2"
textColor = "#1F2328"
borderColor = "#d0d7de"
